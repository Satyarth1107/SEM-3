<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrstion form</title>
</head>
<body>
    <h1 align="center">Student registration form</h1>
    <form>
    <table border="5" align="center">
    <tr>
    <td><label for="fname">First Name:</label></td>
    <td><input type="text" id="fname"></td>
    </tr>
    <tr>
    <td><label for="lname">Last name</label></td>
    <td><input type="text" id="lname"></td>
    </tr>
    <tr>
    <td><label for="Adno">Admisssion number: </label></td>
    <td><input type="number" id="Adno"></td>
    </tr>
    <tr>
    <tr>
    <td><label for="birth">DOB : </label></td>
    <td><input type="date" id="birth"></td>
    </tr>
    <tr>
    <td><label for="dis">Disability : </label></td>
    <td><input type="checkbox" id="dis"></td>
    </tr>
    <tr>
    <td><label for="phone">Phone : </label></td>
    <td><input type="number" id="phone"></td>
    </tr>
    <tr>
    <td><label for="gender">Gender : </label></td>
    <td><input type="radio" id="male" name="gender">Male
        <input type="radio" id="female" name="gender">Female
    </td>
    </tr>
    <tr>
    <tr>
    <td><label for="course">Course : </label>
    <td><select  id="course"> 
        <option>---SELECT COURSE---</option>
        <option>CSE</option>
        <option>CSE DS</option>
        <option>CSE AIML</option>
    </select>
    </td>
    </tr>
    <tr>
    <td><label for="addr">Address : </label></td>
    <td><input type="text" id="addr"></td>
    </tr>
    <tr>
    <td><label for="email">Email :  </label></td>
    <td><input type="email" id="email"></td>
    </tr>
    <tr>
    <td><label for="image">Image :  </label></td>
    <td><input type="file" id="image"></td>
    </tr>
    <tr>
        <td colspan="2" align="center"><input type="button" value="Submit"></td>
    </tr>
    </table>
</form>
</body>
</html>
