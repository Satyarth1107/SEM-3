<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <table>
        <tr>
        <td><label for="Fname"> First Name:</label></td>
        <td><input type="text" name="fname" id="Fname"></td>
        </tr>
        <tr>
        <td><label for="lname">Last Name:</label></td>
        <td><input type="text" name="lname" id="lname"></td>
        </tr>
        <tr>
         <td><label for="FatherName">Father's Name:</label></td>
        <td><input type="text" name="Fathername" id="FatherName"></td>
        </tr>
        <tr>
         <td><label for="MotherName">Mother's Name:</label></td>
        <td><input type="text" name="Mothername" id="MotherName"></td>
        </tr>
        <tr>
        <td><label for="DOB">Date of Birth: </label></td>
        <td><input type="date" name="DOB" id="DOB"></td>
        </tr>
        <tr>
        <td><label for="Email">Email: </label></td>
        <td><input type="email" name="Mothername" id="DOB"></td>
        </tr>
        <tr>
        <td><label for="Gender">Gender: </label></td>
        <td>
            <input type="radio" name="Gender" id="DOB" value="Male">
            <label for="Gender">Male </label>
            <input type="radio" name="Gender" id="DOB" value="Female">
            <label for="Gender">Female </label>
        </td>
        </tr>
        <td><label for="Course">Choose course: </label></td>
        <td><select name="Course">
        <option>---select---</option>
          <option>CSE</option>
          <option>Mechanical</option>
          <option>CIVIL</option>
        </select></td>
        <tr>
            <td><label for="hobbies">Hobbies: </label>
            </td>
            <td>
                <input type="checkbox" name="Sport" id="sport">
                <label for="sport">Sport</label>
                <input type="checkbox" name="Dance" id="Dance">
                <label for="Dance">Dancing</label>
                <input type="checkbox" name="sing" id="sing">
                <label for="sing">Singing</label>
            </td>
            <tr>
                <td><label for="address">Address:</label></td>
                <td><textarea id="address" name="address" rows="5" cols="30"></textarea></td>
            </tr>
        </tr>

        </table>

    </form>
</body>
</html>
